name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test LWhisper.Tests/LWhisper.Tests.csproj --configuration Release --no-build

  # Guardrail D7 (Pi-readiness): Core и SpeechEngine обязаны собираться под Linux.
  # Windows-API или win-only пакет в общих слоях валит этот job.
  linux-guard:
    name: Linux guard (Core + SpeechEngine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Build Core (linux-x64)
        run: dotnet build LWhisper.Core/LWhisper.Core.csproj --configuration Release -r linux-x64

      - name: Build SpeechEngine (linux-x64)
        run: dotnet build LWhisper.SpeechEngine/LWhisper.SpeechEngine.csproj --configuration Release -r linux-x64
